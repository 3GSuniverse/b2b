# Production: everything runs on one always-on machine (a Linux VM, or Windows with Docker Desktop),
# reachable only through the Cloudflare tunnel.
# Used by deploy/drona (install, deploy, backup). Settings come from deploy/.env.
name: drona

x-app: &app
  image: drona:latest
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://drona:${POSTGRES_PASSWORD}@postgres:5432/drona
    REDIS_URL: redis://redis:6379
  volumes:
    # Google OAuth client file for "Connect Gmail" (optional), kept outside git
    - ./secrets:/etc/drona:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: 20m, max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drona
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drona']
      interval: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queued sends and schedules must survive restarts, and must never be evicted
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # Applies database changes, then exits. The API and worker wait for it.
  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/cli/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/server.js']
    # Only this VM can reach it; the public gets in through the Cloudflare tunnel
    ports:
      - '127.0.0.1:${DRONA_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Nightly database backup at 02:30 India time (21:00 UTC) into deploy/backups, keeping the newest 3.
  # Runs inside Docker, so it works the same on a Linux VM and on Windows (Docker Desktop) without cron.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_LOCAL: ${KEEP_LOCAL:-3}
    volumes:
      - ./backups:/backups
    entrypoint: ['sh', '-c']
    command:
      - |
        echo "Nightly backups at 21:00 UTC (02:30 IST) into deploy/backups"
        while true; do
          if [ "$$(date -u +%H%M)" = "2100" ]; then
            f="/backups/drona-$$(date -u -d @$$(( $$(date +%s) + 19800 )) +%Y%m%d-%H%M%S 2>/dev/null || date -u +%Y%m%d-%H%M%S).sql.gz"
            if pg_dump -h postgres -U drona --no-owner drona | gzip > "$$f.part" && [ -s "$$f.part" ]; then
              mv "$$f.part" "$$f" && echo "Backup: $$f"
              ls -1t /backups/drona-*.sql.gz | tail -n +$$(( KEEP_LOCAL + 1 )) | xargs -r rm -f
            else
              rm -f "$$f.part"; echo "Backup FAILED"
            fi
            sleep 60
          fi
          sleep 30
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: '2' }

volumes:
  pgdata:
  redisdata:
